<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pebble — Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #FAF7F2;
    --animals: #F5D18F;
    --ocean: #99CCE9;
    --weather: #C7B8EB;
    --earth: #AED9A8;
    --dinosaurs: #EBAD99;
    --text: #2C2C2E;
    --text-secondary: #8E8E93;
    --card-bg: #FFFFFF;
    --radius: 24px;
    --shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
  }

  .phone-frame {
    width: 393px;
    max-width: 100vw;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 500px) {
    body { background: #E8E4DF; display: flex; justify-content: center; padding: 20px 0; }
    .phone-frame {
      min-height: 852px;
      height: 852px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow-y: auto;
      overflow-x: hidden;
    }
  }

  .screen { display: none; padding: 0 20px 40px; }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .nav-bar {
    display: flex;
    align-items: center;
    padding: 16px 20px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .back-btn {
    background: none; border: none; font-size: 18px; color: var(--text);
    cursor: pointer; padding: 8px 12px 8px 0; display: flex; align-items: center;
    gap: 4px; font-family: inherit; font-weight: 600;
  }
  .back-btn:hover { opacity: 0.7; }

  /* Home screen */
  .home-header { text-align: center; padding: 32px 0 24px; }
  .home-header .logo { font-size: 56px; }
  .home-header h1 { font-size: 34px; font-weight: 800; margin: 4px 0; }
  .home-header p { font-size: 18px; color: var(--text-secondary); font-weight: 600; }

  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .category-card {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 160px; border-radius: var(--radius); border: none; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s; color: white;
    background-size: cover; background-position: center; overflow: hidden;
    position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .category-card:hover { transform: scale(1.03); }
  .category-card:active { transform: scale(0.97); }
  .category-card .emoji { font-size: 48px; position: relative; z-index: 1; }
  .category-card .cat-label {
    position: relative; z-index: 1; width: 100%; text-align: center;
    padding: 10px 0; background: linear-gradient(transparent, rgba(0,0,0,0.55));
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .category-card .name { font-size: 19px; font-weight: 700; color: white; }
  .category-card .count { font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 600; }

  .cat-animals { background-color: rgba(245,209,143,0.3); }
  .cat-ocean { background-color: rgba(153,204,233,0.3); }
  .cat-weather { background-color: rgba(199,184,235,0.3); }
  .cat-earth { background-color: rgba(174,217,168,0.3); }
  .cat-dinosaurs { background-color: rgba(235,173,153,0.3); }

  .screen-title { font-size: 34px; font-weight: 800; padding: 8px 0 20px; }
  .screen-emoji { text-align: center; font-size: 56px; padding: 8px 0; }

  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .topic-card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; cursor: pointer; transition: transform 0.2s; color: var(--text);
  }
  .topic-card:hover { transform: scale(1.03); }
  .topic-card:active { transform: scale(0.97); }
  .topic-card .image-area {
    height: 120px; display: flex; align-items: center; justify-content: center; font-size: 56px;
  }
  .topic-card .label { text-align: center; padding: 10px 8px 14px; font-size: 17px; font-weight: 700; }

  /* Hero & fact */
  .hero-area {
    border-radius: var(--radius); height: 240px; display: flex; align-items: center;
    justify-content: center; font-size: 100px; margin-bottom: 20px;
  }
  .fact-text {
    text-align: center; font-size: 20px; font-weight: 600; line-height: 1.5; padding: 0 8px 20px;
  }
  .section-label {
    font-size: 15px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 4px;
  }

  /* Exploration grid */
  .explore-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
  }
  .explore-card {
    background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow);
    overflow: hidden; cursor: pointer; transition: transform 0.2s; color: var(--text);
  }
  .explore-card:hover { transform: scale(1.03); }
  .explore-card:active { transform: scale(0.97); }
  .explore-card .explore-img {
    height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px;
  }
  .explore-card .explore-label {
    text-align: center; padding: 8px 6px 10px; font-size: 14px; font-weight: 700; line-height: 1.2;
  }

  /* Related topics */
  .related-scroll {
    display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .related-scroll::-webkit-scrollbar { display: none; }
  .related-item {
    flex-shrink: 0; width: 100px; text-align: center; cursor: pointer; color: var(--text);
  }
  .related-item:hover { transform: scale(1.05); }
  .related-item .rel-img {
    width: 100px; height: 100px; border-radius: 20px; display: flex;
    align-items: center; justify-content: center; font-size: 40px; margin-bottom: 6px;
  }
  .related-item .rel-name { font-size: 14px; font-weight: 600; }
</style>
</head>

    <div class="related-scroll" id="topic-related"></div>

  <div class="screen" id="screen-explore">

</div>

];

// Build lookups
const explorationsByParent = {};
const explorationsById = {};
explorations.forEach(e => {
  if (!explorationsByParent[e.parentID]) explorationsByParent[e.parentID] = [];
  explorationsByParent[e.parentID].push(e);
  explorationsById[e.id] = e;
});

// Wikipedia title mapping for seed topics
const wikiTitles = {
  dolphin:'Bottlenose_dolphin', bat:'Bat', elephant:'African_elephant', penguin:'Emperor_penguin',
  butterfly:'Monarch_butterfly', frog:'Red-eyed_tree_frog', owl:'Barn_owl',
  'coral-reef':'Coral_reef', whale:'Humpback_whale', 'sea-turtle':'Green_sea_turtle',
  octopus:'Common_octopus', jellyfish:'Jellyfish', starfish:'Starfish',
  storm:'Thunderstorm', rainbow:'Rainbow', snow:'Snowflake', tornado:'Tornado',
  clouds:'Cumulus_cloud', lightning:'Lightning',
  volcano:'Volcano', waterfall:'Waterfall', desert:'Sahara', cave:'Cave',
  mountain:'Mountain', forest:'Temperate_rainforest',
  't-rex':'Tyrannosaurus', triceratops:'Triceratops', stegosaurus:'Stegosaurus',
  brachiosaurus:'Brachiosaurus', pteranodon:'Pteranodon', velociraptor:'Velociraptor'
};

// Add exploration node wiki titles to the mapping
explorations.forEach(e => { wikiTitles[e.id] = e.wikiTitle; });

// Image cache
const imageCache = {};
async function fetchWikiImage(nodeId) {
  if (imageCache[nodeId]) return imageCache[nodeId];
  const title = wikiTitles[nodeId];
  if (!title) return null;
  try {
    const resp = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    const data = await resp.json();
    const url = data.thumbnail?.source || data.originalimage?.source;
    if (url) {
      const bigUrl = url.replace(/\/\d+px-/, '/600px-');
      imageCache[nodeId] = bigUrl;
      return bigUrl;
    }
  } catch(e) {}
  return null;
}

function loadImage(el, nodeId, emoji) {
  fetchWikiImage(nodeId).then(url => {
    if (url) {
      el.style.backgroundImage = `url(${url})`;
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.textContent = '';
    }
  });
}

const catColors = { Animals:'var(--animals)', Ocean:'var(--ocean)', Weather:'var(--weather)', Earth:'var(--earth)', Dinosaurs:'var(--dinosaurs)' };
const catEmojis = { Animals:'🐾', Ocean:'🌊', Weather:'🌤️', Earth:'🌍', Dinosaurs:'🦕' };

let currentCategory = '';
let currentTopicId = '';
let navStack = [];

function topicById(id) { return topics.find(t => t.id === id); }
function explorationById(id) { return explorationsById[id]; }

// Get siblings of an exploration node (other children of same parent, excluding self)
function getSiblings(nodeId) {
  const node = explorationsById[nodeId];
  if (!node) return [];
  return (explorationsByParent[node.parentID] || []).filter(n => n.id !== nodeId);
}

// Get related content for a leaf node (siblings + random from same category)
function getRelatedContent(nodeId, category) {
  let results = getSiblings(nodeId);
  const usedIds = new Set([nodeId, ...results.map(r => r.id)]);

  if (results.length < 6) {
    const categoryNodes = explorations.filter(e => e.category === category && !usedIds.has(e.id));
    // Shuffle and take what we need
    for (let i = categoryNodes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [categoryNodes[i], categoryNodes[j]] = [categoryNodes[j], categoryNodes[i]];
    }
    results = results.concat(categoryNodes.slice(0, 6 - results.length));
  }

  return results.slice(0, 6);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('.phone-frame').scrollTop = 0;
}

function goHome() { navStack = []; showScreen('screen-home'); }

function showCategory(cat) {
  currentCategory = cat;
  navStack = ['home'];
  document.getElementById('cat-emoji').textContent = catEmojis[cat];
  document.getElementById('cat-title').textContent = cat;
  const catTopics = topics.filter(t => t.category === cat);
  const grid = document.getElementById('cat-topics');
  grid.innerHTML = catTopics.map(t => `
    <div class="topic-card" onclick="showTopic('${t.id}')">
      <div class="image-area" data-topic="${t.id}" style="background:${catColors[cat]}30">${t.emoji}</div>
      <div class="label">${t.title}</div>
    </div>
  `).join('');
  catTopics.forEach(t => {
    const el = grid.querySelector(`[data-topic="${t.id}"]`);
    if (el) loadImage(el, t.id, t.emoji);
  });
  showScreen('screen-category');
}

function backToCategory() { showCategory(currentCategory); }

function renderExploreGrid(container, nodes, color) {
  container.innerHTML = nodes.map(e => `
    <div class="explore-card" onclick="showExploration('${e.id}')">
      <div class="explore-img" data-explore="${e.id}" style="background:${color}30">${e.emoji}</div>
      <div class="explore-label">${e.title}</div>
    </div>
  `).join('');
  nodes.forEach(e => {
    const el = container.querySelector(`[data-explore="${e.id}"]`);
    if (el) loadImage(el, e.id, e.emoji);
  });
}

function showTopic(id) {
  currentTopicId = id;
  const t = topicById(id);
  if (!t) return;
  currentCategory = t.category;
  navStack = ['home', 'category'];
  const color = catColors[t.category];

  document.getElementById('topic-title').textContent = t.title;
  const heroEl = document.getElementById('topic-hero');
  heroEl.style.background = color + '40';
  heroEl.style.backgroundImage = '';
  heroEl.textContent = t.emoji;
  loadImage(heroEl, t.id, t.emoji);
  document.getElementById('topic-fact').textContent = t.fact;

  // Exploration grid
  const subs = explorationsByParent[t.id] || [];
  const exploreGrid = document.getElementById('topic-explore-grid');
  if (subs.length > 0) {
    renderExploreGrid(exploreGrid, subs, color);
  } else {
    exploreGrid.innerHTML = '';
  }

  // Related topics
  const relContainer = document.getElementById('topic-related');
  relContainer.innerHTML = t.related.map(rid => {
    const r = topicById(rid);
    if (!r) return '';
    return `
      <div class="related-item" onclick="showTopic('${r.id}')">
        <div class="rel-img" data-rel-topic="${r.id}" style="background:${catColors[r.category]}30">${r.emoji}</div>
        <div class="rel-name">${r.title}</div>
      </div>
    `;
  }).join('');
  t.related.forEach(rid => {
    const r = topicById(rid);
    if (!r) return;
    const el = relContainer.querySelector(`[data-rel-topic="${rid}"]`);
    if (el) loadImage(el, rid, r.emoji);
  });

  showScreen('screen-topic');
}

function showExploration(nodeId) {
  const node = explorationById(nodeId);
  if (!node) return;
  const color = catColors[node.category];

  // Push current state to nav stack
  navStack.push({ type: 'explore', id: nodeId });

  document.getElementById('explore-title').textContent = node.title;
  const heroEl = document.getElementById('explore-hero');
  heroEl.style.background = color + '30';
  heroEl.style.backgroundImage = '';
  heroEl.textContent = node.emoji;
  loadImage(heroEl, node.id, node.emoji);
  document.getElementById('explore-fact').textContent = node.fact;

  // Sub-explorations
  const subs = explorationsByParent[node.id] || [];
  const gridEl = document.getElementById('explore-grid');
  const labelEl = document.getElementById('explore-grid-label');

  if (subs.length > 0) {
    labelEl.textContent = 'Explore';
    labelEl.style.display = '';
    renderExploreGrid(gridEl, subs, color);
  } else {
    // No dead ends — show related content
    const related = getRelatedContent(nodeId, node.category);
    if (related.length > 0) {
      labelEl.textContent = 'Keep Exploring';
      labelEl.style.display = '';
      renderExploreGrid(gridEl, related, color);
    } else {
      labelEl.style.display = 'none';
      gridEl.innerHTML = '';
    }
  }

  // "You Might Also Like" — related seed topics from same category
  const relLabel = document.getElementById('explore-related-label');
  const relContainer = document.getElementById('explore-related');
  const categoryTopics = topics.filter(t => t.category === node.category && t.id !== node.parentID).slice(0, 5);

  if (categoryTopics.length > 0) {
    relLabel.style.display = '';
    relContainer.innerHTML = categoryTopics.map(r => `
      <div class="related-item" onclick="showTopic('${r.id}')">
        <div class="rel-img" data-rel-explore-topic="${r.id}" style="background:${catColors[r.category]}30">${r.emoji}</div>
        <div class="rel-name">${r.title}</div>
      </div>
    `).join('');
    categoryTopics.forEach(r => {
      const el = relContainer.querySelector(`[data-rel-explore-topic="${r.id}"]`);
      if (el) loadImage(el, r.id, r.emoji);
    });
  } else {
    relLabel.style.display = 'none';
    relContainer.innerHTML = '';
  }

  // Back button for exploration
  document.getElementById('explore-back-btn').onclick = function() {
    navStack.pop();
    const prev = navStack[navStack.length - 1];
    if (prev && prev.type === 'explore') {
      navStack.pop();
      showExploration(prev.id);
    } else {
      showTopic(currentTopicId);
    }
  };

  showScreen('screen-explore');
}

// Build home screen
function initHome() {
  const categories = ['Animals', 'Ocean', 'Weather', 'Earth', 'Dinosaurs'];
  const repTopics = {};
  categories.forEach(cat => { repTopics[cat] = topics.find(t => t.category === cat); });

  const grid = document.getElementById('home-categories');
  grid.innerHTML = categories.map(cat => {
    const count = topics.filter(t => t.category === cat).length;
    const cssClass = 'cat-' + cat.toLowerCase();
    return `
      <div class="category-card ${cssClass}" data-cat-img="${cat}" onclick="showCategory('${cat}')">
        <div class="emoji">${catEmojis[cat]}</div>
        <div class="cat-label">
          <div class="name">${cat}</div>
          <div class="count">${count} topics</div>
        </div>
      </div>
    `;
  }).join('');

  categories.forEach(cat => {
    const rep = repTopics[cat];
    if (!rep) return;
    const el = grid.querySelector(`[data-cat-img="${cat}"]`);
    if (!el) return;
    fetchWikiImage(rep.id).then(url => {
      if (url) {
        el.style.backgroundImage = `url(${url})`;
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        const emojiEl = el.querySelector('.emoji');
        if (emojiEl) emojiEl.style.display = 'none';
      }
    });
  });
}

initHome();
</script>
